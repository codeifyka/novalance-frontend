<div class="w-full flex flex-col items-center border-t-2 py-4 border-gray-200">
  <div :class="['w-full','flex flex-col md:flex-row justify-between items-start md:items-center gap-4','py-4']">
    <div class="flex gap-4 w-full md:w-[45%] items-center">
      <img
        :src="serviceImage"
        class="w-24 h-24 object-cover rounded-lg bg-gray-100 flex-shrink-0"
        alt="service thumbnail"
      />
      <div class="flex flex-col justify-between gap-1">
        <div class="flex flex-col">
          <div class="font-bold text-base md:text-lg capitalize text-gray-900">
            {{ purchase?.service?.title || 'Purchased Service' }}
          </div>
          <div class="flex items-center gap-3">
            <span class="text-green-600 font-semibold text-base">${{ purchase?.price }}</span>
            <span class="text-xs px-2 py-0.5 rounded-full capitalize bg-green-100 text-green-700 font-medium">
              {{ purchase?.status || 'Active' }}
            </span>
          </div>
          <div v-if="purchase?.freelancer" class="text-xs text-gray-500 mt-1">
            Freelancer: <span class="font-medium text-gray-700 capitalize">{{ purchase.freelancer.first_name }} {{ purchase.freelancer.last_name }}</span>
          </div>
          <div v-if="formattedDate" class="text-xs text-gray-400">
            Purchased on {{ formattedDate }}
          </div>
        </div>
        <div
          @click="viewService"
          class="underline text-primary md:text-sm cursor-pointer hover:opacity-75 text-xs font-medium w-fit mt-1"
        >
          View service
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button
        @click="openChat"
        class="bg-primary text-white text-sm rounded-xl px-4 md:px-8 py-2 font-semibold hover:bg-opacity-80 transition cursor-pointer flex items-center gap-2"
      >
        <Icon icon="teenyicons:chat-outline" class="w-4 h-4" />
        <span>Open chat</span>
      </button>
    </div>
  </div>
</div>
