<div v-if="total !== undefined && total > 0" class="flex flex-col sm:flex-row items-center justify-between gap-4 py-8 border-t border-gray-200 mt-4 w-full">
    <div v-if="perPage && total" class="text-xs sm:text-sm text-gray-500">
        Showing <span class="font-semibold text-black">{{ showingFrom }}</span> to <span class="font-semibold text-black">{{ showingTo }}</span> of <span class="font-semibold text-black">{{ total }}</span> {{ itemLabel }}
    </div>
    <div v-if="lastPage > 1" class="flex items-center gap-1">
        <button
            type="button"
            @click="prevPage"
            :disabled="currentPage === 1"
            class="px-3 py-1.5 rounded-md border text-sm font-medium transition-colors"
            :class="currentPage === 1 ? 'opacity-40 cursor-not-allowed border-gray-200 text-gray-400' : 'hover:bg-gray-100 border-gray-300 text-black cursor-pointer'"
        >
            Previous
        </button>
        <template v-for="(p, idx) in paginationPages" :key="idx">
            <span v-if="p === '...'" class="px-2 text-gray-400 text-sm select-none">...</span>
            <button
                v-else
                type="button"
                @click="goToPage(p)"
                class="w-8 h-8 rounded-md text-sm font-medium transition-colors"
                :class="currentPage === p ? 'bg-primary text-white' : 'hover:bg-gray-100 text-black border border-gray-200 cursor-pointer'"
            >
                {{ p }}
            </button>
        </template>
        <button
            type="button"
            @click="nextPage"
            :disabled="currentPage === lastPage"
            class="px-3 py-1.5 rounded-md border text-sm font-medium transition-colors"
            :class="currentPage === lastPage ? 'opacity-40 cursor-not-allowed border-gray-200 text-gray-400' : 'hover:bg-gray-100 border-gray-300 text-black cursor-pointer'"
        >
            Next
        </button>
    </div>
</div>
