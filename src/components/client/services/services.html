<div class="w-full min-h-screen">
    <ClientHeaderVue />
    <div class="mt-20 w-full p-8 md:p-0">
        <Loading v-if="isLoading" />
        <div v-else-if="services.length === 0" class="py-20 flex flex-col items-center justify-center text-center">
            <h1 class="font-bold text-2xl text-gray-700 mb-2">No Services Found</h1>
            <p class="text-sm text-gray-400">There are currently no services matching your request.</p>
        </div>
        <div class="py-10 flex flex-col items-center" v-else>
            <h1 class="md:text-center my-4 w-full font-bold text-2xl md:text-4xl text-regal-purple">Our Services</h1>
            <div class="md:w-3/4 w-full flex items-center flex-wrap md:p-10">
                <div class="md:w-1/3 m-2 w-full flex flex-col justify-between mb-8" v-for="service in services" :key="service.id">
                    <Service v-motion-slide-visible-once-top :service="service" />
                </div>
            </div>
        </div>
    </div>
    <ClientFooterVue />
</div>
