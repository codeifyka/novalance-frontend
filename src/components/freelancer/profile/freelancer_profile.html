<div class="w-full h-screen overflow-auto flex flex-col items-center bg-violet-50 freelancer-background">
    <Loading v-if="isLoading" />
    <div class="w-11/12 flex flex-col items-center">
        <FreeLancerHeaderVue target="profile" />
    </div>
    <div class="w-11/12 flex-grow flex flex-col my-16 bg-gray-50/60 rounded-lg p-4">
        <div class="uppercase font-semibold text-lg text-purple-800">Profile:</div>
        <div class="w-full flex flex-col items-center">
            <div class="w-32 h-32 rounded-full shadow-lg relative group">
                <img class="h-full w-full rounded-full object-cover" :src="user?.profile_picture || '/default_profile_picture.jpg'" alt="profile picture" />
                <div v-if="isAvatarLoading" class="absolute inset-0 rounded-full bg-black/40 flex items-center justify-center">
                    <LoadingSpinner class="w-8 h-8 text-white" />
                </div>
                <input type="file" ref="avatarInputRef" accept="image/*" @change="onAvatarSelected" class="hidden" />
                <button type="button" @click="triggerAvatarSelect" :disabled="isAvatarLoading" title="Change profile picture" class="absolute bottom-0 right-0 bg-blue-600 text-purple-50 p-2 rounded-full hover:bg-blue-700 cursor-pointer shadow-md transition-transform active:scale-110">
                    <Icon icon="mdi:camera" class="w-5 h-5" />
                </button>
            </div>
            <div class="md:w-11/12 w-full flex flex-col items-center my-8">
                <div v-if="errors.general" class="md:w-3/4 w-full mb-4 p-3 bg-red-100 border border-red-300 text-red-700 rounded-lg text-sm">
                    {{ errors.general }}
                </div>
                <div class="md:w-3/4 w-full flex flex-col md:flex-row gap-4 md:gap-0 items-center justify-between mb-4">
                    <div class="flex-grow w-full bg-violet-200/60 rounded-lg md:mr-4 shadow-lg p-1">
                        <input :class="`py-2 bg-transparent px-4 rounded-lg placeholder:text-purple-300 w-full outline-none focus:bg-violet-300 text-purple-700 ${errors.first_name ? 'border border-red-500' : ''}`" placeholder="First name" v-model="user.first_name" />
                        <span v-if="errors.first_name" class="text-xs text-red-600 px-4 font-medium">{{ errors.first_name }}</span>
                    </div>
                    <div class="flex-grow w-full bg-violet-200/60 rounded-lg md:ml-4 shadow-lg p-1">
                        <input :class="`py-2 bg-transparent px-4 rounded-lg placeholder:text-purple-300 w-full outline-none focus:bg-violet-300 text-purple-700 ${errors.last_name ? 'border border-red-500' : ''}`" placeholder="Last name" v-model="user.last_name" />
                        <span v-if="errors.last_name" class="text-xs text-red-600 px-4 font-medium">{{ errors.last_name }}</span>
                    </div>
                </div>
                <div class="md:w-3/4 w-full bg-violet-200/60 rounded-lg shadow-lg mb-4 p-1">
                    <input :class="`py-2 bg-transparent px-4 rounded-lg placeholder:text-purple-300 w-full outline-none focus:bg-violet-300 text-purple-700 ${errors.username ? 'border border-red-500' : ''}`" placeholder="Username" v-model="user.username" />
                    <span v-if="errors.username" class="text-xs text-red-600 px-4 font-medium">{{ errors.username }}</span>
                </div>
                <div class="md:w-3/4 w-full bg-violet-200/60 rounded-lg shadow-lg mb-4 p-1">
                    <input :class="`py-2 bg-transparent px-4 rounded-lg placeholder:text-purple-300 w-full outline-none focus:bg-violet-300 text-purple-700 ${errors.email ? 'border border-red-500' : ''}`" placeholder="Email" v-model="user.email" disabled />
                    <span v-if="errors.email" class="text-xs text-red-600 px-4 font-medium">{{ errors.email }}</span>
                </div>
                <div class="md:w-3/4 w-full flex items-center justify-between mt-4">
                    <button type="button" @click="openPasswordModal" class="text-sm font-semibold text-purple-700 hover:text-purple-900 underline cursor-pointer flex items-center gap-1.5">
                        <Icon icon="mdi:lock-reset" class="w-4 h-4" />
                        Change Password
                    </button>
                    <button @click="save" class="bg-violet-500 hover:bg-violet-600 text-purple-50 px-16 py-2 w-full md:w-fit rounded-lg font-semibold uppercase cursor-pointer">Save</button>
                </div>
            </div>
        </div>  
    </div>

    <!-- Change Password Modal -->
    <div v-if="isPasswordModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="closePasswordModal">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 flex flex-col gap-5">
            <div class="flex items-center justify-between pb-3 border-b">
                <h3 class="text-lg font-bold text-gray-800">Change Password</h3>
                <button @click="closePasswordModal" class="text-gray-400 hover:text-gray-600 text-xl font-bold cursor-pointer">&times;</button>
            </div>

            <div v-if="passwordErrors.general" class="p-3 bg-red-100 border border-red-300 text-red-700 rounded-xl text-xs">
                {{ passwordErrors.general }}
            </div>

            <div class="flex flex-col gap-4">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-700">Current Password</label>
                    <input
                        type="password"
                        v-model="passwordForm.current_password"
                        placeholder="Enter current password"
                        :class="`border rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-600 ${passwordErrors.current_password ? 'border-red-500' : 'border-gray-300'}`"
                    />
                    <span v-if="passwordErrors.current_password" class="text-xs text-red-500 font-medium">{{ passwordErrors.current_password }}</span>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-700">New Password</label>
                    <input
                        type="password"
                        v-model="passwordForm.new_password"
                        placeholder="Minimum 6 characters"
                        :class="`border rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-600 ${passwordErrors.new_password ? 'border-red-500' : 'border-gray-300'}`"
                    />
                    <span v-if="passwordErrors.new_password" class="text-xs text-red-500 font-medium">{{ passwordErrors.new_password }}</span>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-700">Confirm New Password</label>
                    <input
                        type="password"
                        v-model="passwordForm.confirm_password"
                        placeholder="Re-type new password"
                        :class="`border rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-600 ${passwordErrors.confirm_password ? 'border-red-500' : 'border-gray-300'}`"
                    />
                    <span v-if="passwordErrors.confirm_password" class="text-xs text-red-500 font-medium">{{ passwordErrors.confirm_password }}</span>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t">
                <button
                    type="button"
                    @click="closePasswordModal"
                    class="px-4 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-100 rounded-xl cursor-pointer"
                >
                    Cancel
                </button>
                <button
                    type="button"
                    @click="changePassword"
                    :disabled="isPasswordLoading"
                    class="px-6 py-2 text-sm font-semibold text-white bg-purple-600 hover:bg-purple-700 rounded-xl disabled:opacity-50 cursor-pointer"
                >
                    {{ isPasswordLoading ? 'Updating...' : 'Update Password' }}
                </button>
            </div>
        </div>
    </div>
</div>
