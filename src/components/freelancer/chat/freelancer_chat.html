<div class="w-full h-screen bg-white">
    <Loading v-if="isLoading" />
    <FreeLancerHeaderVue target="profile" />
    <div class="mt-24 flex items-start justify-between md:mx-24 mx-8">
        <div class="w-full md:w-4/12 rounded-br-3xl h-full md:block" :class="chatScreenState ? 'hidden' : 'block'">
            <h1 class="text-xl font-semibold my-2">Recent Chats</h1>
            <div class="overflow-y-auto hide-scrollbar h-80">
                <div 
                    v-for="client in clients" 
                    @click="ChangeCurrentUser(client.id)"
                    :key="client.id" 
                    :class="['flex', 'cursor-pointer', 'hover:bg-black/10', currentUser?.id == client.id ? 'bg-black/5': '', 'hover:bg-opacity-20', 'p-2', 'rounded-lg', 'items-center']"
                >
                    <div class="w-12 h-12 rounded-full overflow-hidden bg-gray-100 mx-3 shrink-0 relative">
                        <img 
                            :src="client.client?.profile_picture || DEFAULT_PROFILE_PICTURE" 
                            :alt="client.client?.username" 
                            class="w-full h-full object-cover" 
                            @error="$event.target.src = DEFAULT_PROFILE_PICTURE"
                        />
                        <div class="absolute bottom-0 right-0 h-2.5 w-2.5 bg-green-500 rounded-full border-2 border-white"></div>
                    </div>
                    <div class="flex flex-col w-2/3 min-w-0">
                        <div class="flex items-center gap-2 justify-between">
                            <span class="font-medium truncate text-sm">
                                {{ [client.client?.first_name, client.client?.last_name].filter(Boolean).join(' ') || client.client?.username || 'Client' }}
                            </span>
                            <span 
                                v-if="client.chat_tag || client.tag" 
                                class="shrink-0 text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider"
                                :class="(client.chat_tag || client.tag) === 'service' ? 'bg-emerald-100 text-emerald-700' : 'bg-purple/10 text-purple'"
                            >
                                {{ (client.chat_tag || client.tag) === 'service' ? 'Service' : 'Job Post' }}
                            </span>
                        </div>
                        <span class="font-semibold opacity-30 text-xs truncate">
                            {{ truncatedMessage(client.last_message?.message) || 'No messages yet' }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <ChatRoomVue :client="currentUser" :class="chatScreenState ? 'block' : 'hidden'"
            @chatState="toggleChatScreen" v-if="currentUser" @received-message="handleMessage" />
    </div>
</div>
