<transition name="fade" @before-enter="beforeEnter" @enter="enter" @leave="leave">
    <div v-if="isOpen" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50">
        <div class="bg-white relative rounded-lg shadow-lg p-6 w-2/3 flex flex-col gap-8 max-h-[80vh] overflow-auto">
            <Icon icon="material-symbols:close" @click="closeModal" width="24" height="24" class="rounded-full absolute top-4 right-4 cursor-pointer transition-all duration-150 hover:text-white hover:bg-purple text-purple"/>
            <div class="w-full flex flex-col items-center">
                <div class="w-28 h-28 rounded-full capitalize bg-gray-50 flex items-center justify-center">{{client.username}}</div>
                <div class="text-purple font-bold capitalize ">{{client.first_name}} {{client.last_name}}</div>
                <div class="flex items-center text-purple gap-2">
                    <Icon icon="subway:world-1" width="20" height="20" />
                    <div class="capitalize font-light">{{client.country || 'Not provided'}}</div>
                </div>
                <button
                    type="button"
                    @click="goToChat"
                    :disabled="isNavigatingToChat"
                    class="mt-3 inline-flex items-center gap-2 px-5 py-2 bg-purple text-white text-sm font-semibold rounded-full shadow hover:bg-opacity-90 active:scale-95 transition-all cursor-pointer disabled:opacity-50"
                    :title="`Chat with ${[client.first_name, client.last_name].filter(Boolean).join(' ') || client.username || 'Client'}`"
                >
                    <Icon icon="teenyicons:chat-outline" width="16" height="16" />
                    <span>{{ isNavigatingToChat ? 'Opening chat...' : `Chat with ${client.first_name || client.username || 'Client'}` }}</span>
                </button>
            </div>
            <div class="w-full flex flex-col items-start mt-4">
                <div class="flex items-center text-purple gap-2 ">
                    <Icon icon="ic:baseline-email" width="20" height="20" />
                    <div class="font-light">{{client.email}}</div>
                </div>
                <div class="flex items-center text-purple gap-2 ">
                    <Icon icon="file-icons:telegram" width="20" height="20" />
                    <div class="font-light">{{client.telephone}}</div>
                </div>
                <div class="flex items-center text-purple gap-2 ">
                    <Icon icon="ph:gender-transgender-fill" width="20" height="20" />
                    <div class="capitalize font-light">{{client.gender}}</div>
                </div>
            </div>
            <div class="w-full flex-col items-start">
                <div class="text-purple font-semibold">Job Posts</div>
                <div v-if="isLoading" class="text-sm text-gray-400 py-2">Loading job posts...</div>
                <div v-else-if="jobPosts.length === 0" class="text-sm text-gray-400 py-2">No job posts yet</div>
                <div v-else class="flex flex-wrap gap-2">
                    <div class="w-1/5 flex flex-col justify-between mb-4" v-for="job in jobPosts" :key="job.id">
                        <a :href="`/job/${job.id}`" class="w-11/12 hover:w-5/6 duration-300 flex flex-col rounded-lg relative">
                            <div class="w-full h-24 bg-violet-200 rounded-lg">
                                <img v-if="isImageFile(job.illustrative_files)" :src="getFileUrl(job.illustrative_files)" class="w-full h-full object-cover rounded-lg" />
                                <div v-else class="w-full h-full flex items-center justify-center text-gray-400">
                                    <Icon icon="solar:document-text-bold" class="text-4xl" />
                                </div>
                            </div>
                            <div class="absolute text-sm bottom-0 left-0 px-4 py-1 text-purple-100 bg-black/30 w-full rounded-b-lg">{{job.title}}</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</transition>
