<Loading v-if="isLoading" />
<div :class="background" class="px-3 items-center flex justify-between mt-4 mb-10 rounded-md">
    <div class="w-2/5 md:w-1/5 flex justify-around items-center gap-2">
        <button
            type="button"
            @click="openModal"
            class="flex items-center gap-2 min-w-0 cursor-pointer"
            :title="`View ${freelancerName}'s profile`"
        >
            <img
                :src="freelancer?.profile_picture || DEFAULT_PROFILE_PICTURE"
                :alt="freelancerName"
                class="h-9 w-9 shrink-0 rounded-full object-cover border border-gray-200"
            />
            <span class="text-sm font-medium text-purple hover:underline truncate">{{ freelancerName }}</span>
        </button>
        <router-link
            :to="`/job/${proposal.job_post_id}`"
            class="font-semibold underline opacity-80 hover:text-primary text-center truncate"
        >
            {{ jobPost?.title }}
        </router-link>
    </div>
    <div class="flex justify-around gap-2 text-gray-300 md:w-[35%]" v-if="status == 'pending'">
        <div :class="{'truncate w-16 hover:underline': isTruncated, 'hover:text-purple w-32 cursor-pointer': true}"
            @click="toggleTruncate">{{proposal.cover_letter}}</div>
        <p class="text-center whitespace-nowrap">{{ dateSent }}</p>
        <div class="flex flex-col items-center relative">
            <div @click="menu"
                class="absolute grid place-content-center p-5 w-1 h-1 cursor-pointer transition-colors duration-200 rounded-full hover:bg-violet-100 ">
                <Icon icon="charm:menu-kebab" class="text-purple" />
            </div>
            <div class="py-5 px-2 w-44 h-40 bg-violet-50 shadow-lg absolute top-10 right-14" v-if="menuValue">
                <ul>
                    <li @click="acceptProposal"
                        class="flex items-center mb-2 p-2 transition-colors duration-300 rounded-lg hover:bg-violet-100 hover:bg-opacity-75 cursor-pointer">
                        <Icon class="text-regal-purple" icon="basil:edit-solid" />
                        <span>Accept Proposal</span>
                    </li>
                    <li @click="deleteProposal"
                        class="flex items-center mb-2 p-2 transition-colors duration-300 rounded-lg hover:bg-violet-100 hover:bg-opacity-75 cursor-pointer">
                        <Icon class="text-regal-purple" icon="material-symbols:delete" />
                        <span>Refuse Proposal</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="flex justify-around gap-2 text-gray-300 md:w-5/12" v-else="status == 'active'">
        <span class="text-green-500 capitalize">{{proposal.status}}</span>
        <span class="text-green-500">{{jobPost?.budjet}}$</span>
        <p class="flex flex-col items-center">
            <span>{{startedAtDay}}</span>
            <span>{{startedAtTime}}</span>
        </p>
        <p class="flex flex-col items-center" v-if="proposal.ends_at">
            <span>{{endedAtDay}}</span>
            <span>{{endedAtTime}}</span>
        </p>
        <p>
            Not yet
        </p>
    </div>
    <ModalVue :isOpen="isModalOpen" @close="isModalOpen = false" :freelancer="freelancer" :jobPostId="proposal.job_post_id" />
</div>
